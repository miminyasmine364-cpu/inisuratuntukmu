<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Untukmu</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #fbeef1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 450px;
            width: 100%;
            text-align: center;
            transition: all 0.3s ease;
        }
        .content {
            font-size: 16px;
            line-height: 1.6;
            color: #444;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover {
            background-color: #ff4757;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .page-indicator {
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="letterContent" class="content">
            <!-- Isi surat pertama -->
            Hai! Ini adalah surat pertama untukmu. Semoga harimu menyenangkan ya!
        </div>
        <button id="nextBtn" class="btn" onclick="nextLetter()">Lanjut</button>
        <div id="pageIndicator" class="page-indicator">Halaman 1 dari 3</div>
    </div>

    <script>
        // Tulis semua isi suratmu di dalam array ini:
        const letters = [
            "Hai! Ini adalah surat pertama untukmu. Semoga harimu menyenangkan ya!",
            "Ini pesan kedua. Terima kasih ya sudah mau membaca sampai halaman ini.",
            "Ini pesan terakhir. Sampai jumpa lagi, semoga harimu selalu penuh kebahagiaan! ❤️"
        ];

        let currentIndex = 0;

        function nextLetter() {
            if (currentIndex < letters.length - 1) {
                currentIndex++;
                document.getElementById('letterContent').innerText = letters[currentIndex];
                document.getElementById('pageIndicator').innerText = `Halaman ${currentIndex + 1} dari ${letters.length}`;
                
                // Jika sudah sampai pesan terakhir, ubah teks tombol
                if (currentIndex === letters.length - 1) {
                    document.getElementById('nextBtn').innerText = "Selesai";
                }
            } else {
                alert("Kamu sudah membaca semua suratnya!");
            }
        }
    </script>

</body>
</html>
